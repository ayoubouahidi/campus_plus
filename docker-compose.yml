services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "3000"
    # Login (Auth.js, frontend DOCS.md §7.5). Values live in the root .env (never committed).
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: "true" # behind nginx: trust X-Forwarded-Host/Proto for callback URLs
      AUTH_URL: ${AUTH_URL:-https://localhost} # public site address; without it the URLs get the container port :3000
      AUTH_42_SCHOOL_ID: ${AUTH_42_SCHOOL_ID:-}
      AUTH_42_SCHOOL_SECRET: ${AUTH_42_SCHOOL_SECRET:-}
      BACKEND_URL: ${BACKEND_URL:-}
      BACKEND_INTERNAL_KEY: ${BACKEND_INTERNAL_KEY:-}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-false}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
      - frontend
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_data:
  media_data: