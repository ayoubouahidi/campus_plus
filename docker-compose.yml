services:
  web:
    build: .
    restart: unless-stopped

    expose:
      - "8000"

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    environment:
      # [ahmed] Match the variable used in backend/settings.py.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

      # [ahmed] Make Django's DEBUG setting configurable.
      DEBUG: ${DEBUG:-true}

      # [ahmed] Tell Django to use PostgreSQL inside Docker.
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      # [ahmed] Match the Redis URL used by the realtime app.
      REDIS_URL: redis://redis:6379/0

      # [ahmed] Allow Nginx's Docker hostname and localhost.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped

    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

    depends_on:
      - web
      - frontend

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_data:
  media_data:
