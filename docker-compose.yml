services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    # ports:
    #   - 8000:8000

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web