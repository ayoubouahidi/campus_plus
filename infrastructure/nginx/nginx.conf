
# ==========================================
# RATE LIMITING ZONES (http context)
# ==========================================

limit_req_zone $binary_remote_addr zone=public_api_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_v1_public_events:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_v1_auth_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_v1_auth_register:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_v1_auth_refresh:10m rate=10r/m;

# ==========================================
# UPSTREAM SERVICES
# ==========================================

upstream django_backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

# ==========================================
# HTTP -> HTTPS REDIRECT
# ==========================================

server {
    listen 80;
    server_name localhost 127.0.0.1 campusplus.ma;

    return 301 https://$host$request_uri;
}

# ==========================================
# HTTPS SERVER
# ==========================================

server {
    listen 443 ssl;
    server_name localhost 127.0.0.1 campusplus.ma;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Global request settings
    client_max_body_size 10m;
    limit_req_status 429;

    # ======================================
    # DJANGO STATIC FILES
    # ======================================

    location /static/ {
        alias /app/staticfiles/;
    }

    # ======================================
    # DJANGO MEDIA FILES
    # ======================================

    location /media/ {
        alias /app/media/;
    }

    # ======================================
    # AUTHENTICATION ENDPOINTS
    # ======================================

    # Login - Brute force protection
    location /api/v1/auth/login/ {
        limit_req zone=api_v1_auth_login burst=10 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Register - Signup abuse protection
    location /api/v1/auth/register/ {
        limit_req zone=api_v1_auth_register burst=5 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Token refresh - Excessive request protection
    location /api/v1/auth/token/refresh/ {
        limit_req zone=api_v1_auth_refresh burst=5 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================
    # PUBLIC EVENTS API
    # ======================================

    location /api/v1/public/events/ {
        limit_req zone=api_v1_public_events burst=10 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================
    # GENERAL DJANGO API
    # ======================================

    location /api/v1/public/ {
        limit_req zone=public_api_limit burst=10 nodelay;

        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================
    # DJANGO ADMIN
    # ======================================

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================================
    # WEBSOCKETS (DJANGO CHANNELS)
    # ======================================

    location /ws/ {
        proxy_pass http://django_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ======================================
    # FRONTEND (NEXT.JS)
    # ======================================

    location / {
        proxy_pass http://frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
