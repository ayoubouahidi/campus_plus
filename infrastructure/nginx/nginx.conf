# DOCKER EMBEDDED DNS RESOLVER (follow recreated container IPs)
resolver 127.0.0.11 valid=10s ipv6=off;

# WEBSOCKET CONNECTION UPGRADE MAP
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# RATE LIMITING ZONES (http context)
limit_req_zone $binary_remote_addr zone=auth_callback_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# HTTP -> HTTPS REDIRECT
server {
    listen 80;
    server_name localhost 127.0.0.1 campushub.ma dashboard.localhost dashboard.campushub.ma;

    return 301 https://$host$request_uri;
}

# HTTPS SERVER — STUDENT SITE & API & MONITORING
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1 campushub.ma;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Global request settings
    client_max_body_size 10m;
    limit_req_status 429;

    # Dynamic upstream targets (re-resolved via Docker DNS)
    set $backend_upstream http://backend:8000;
    set $frontend_upstream http://frontend:3000;
    set $grafana_upstream http://grafana:3000;

    # DJANGO STATIC FILES
    location /static/ {
        alias /app/staticfiles/;
    }

    # DJANGO MEDIA FILES
    location /media/ {
        alias /app/media/;
    }

    # GRAFANA MONITORING
    location = /grafana {
        return 301 /grafana/;
    }

    location /grafana/ {
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AUTH.JS EMAIL SIGN-IN AND OAUTH CALLBACKS (brute-force protection)
    location /api/auth/callback/ {
        limit_req zone=auth_callback_limit burst=5 nodelay;

        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AUTHENTICATION ENDPOINTS
    location /api/auth/ {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GENERAL DJANGO API
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DJANGO ADMIN
    location /admin/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WEBSOCKETS (DJANGO CHANNELS)
    location /ws/ {
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # FRONTEND (NEXT.JS)
    location / {
        proxy_pass $frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS SERVER — ADMIN & BOARD DASHBOARD (SEPARATE SUBDOMAIN)
server {
    listen 443 ssl;
    server_name dashboard.localhost dashboard.campushub.ma;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    limit_req_status 429;

    set $dashboard_upstream http://dashboard:3000;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # AUTH.JS CALLBACKS (brute-force protection)
    location /api/auth/callback/ {
        limit_req zone=auth_callback_limit burst=5 nodelay;

        proxy_pass $dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DASHBOARD (NEXT.JS + AUTH.JS + /api/backend/*)
    location / {
        proxy_pass $dashboard_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
