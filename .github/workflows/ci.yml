name: Campus Hub CI
on:
  push:
    branches:  ["Developer"]
  pull_request:
    branches: ["Developer"]
jobs:
  verify_code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Django test
        run: |
          cd infrastructure/app
          python manage.py test
      