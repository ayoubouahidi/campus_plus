name: Campus Hub CI

on:
  push:
    branches: ["Developer"]
  pull_request:
    branches: ["Developer"]

jobs:
  backend_tests:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        env:
          DJANGO_SECRET_KEY: ci-test-only-key-not-for-production-1234567890-abcdefghijklmnop
          DEBUG: "True"
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python manage.py test

  frontend_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Production Image
        run: docker build ./frontend

  dashboard_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Dashboard Production Image
        run: docker build ./dashboard_campus
